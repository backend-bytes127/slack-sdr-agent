services:
  n8n:
    image: n8nio/n8n:latest
    env_file: .env   # SLACK_*, CLAY_*, HEYREACH_*, INSTANTLY_* config read via $env in workflows
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_PROXY_HOPS=1
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_EDITOR_BASE_URL=http://localhost:${N8N_HOST_PORT:-8088}/
      - GENERIC_TIMEZONE=${TZ:-Asia/Kolkata}
      - TZ=${TZ:-Asia/Kolkata}
      - N8N_ENCRYPTION_KEY=${N8N_ENCRYPTION_KEY}
      - N8N_SECURE_COOKIE=false
      - N8N_RUNNERS_ENABLED=true
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=false
      - NODE_FUNCTION_ALLOW_BUILTIN=crypto
      - N8N_LOG_LEVEL=info
    volumes:
      - n8n_data:/home/node/.n8n
    expose:
      - "5678"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:5678/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10

  # Local stand-in for Supabase (same Postgres schema). Point the n8n
  # "SDR Postgres" credential at your Supabase connection string to switch.
  db:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=sdr
      - POSTGRES_PASSWORD=${SDR_DB_PASSWORD}
      - POSTGRES_DB=sdr
    volumes:
      - db_data:/var/lib/postgresql/data
      - ./db/schema.sql:/docker-entrypoint-initdb.d/01_schema.sql:ro
    ports:
      - "127.0.0.1:54329:5432"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sdr -d sdr"]
      interval: 5s
      retries: 10

  nginx:
    image: nginx:1.27-alpine
    ports:
      - "${N8N_HOST_PORT:-8088}:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - n8n
    restart: unless-stopped

volumes:
  n8n_data:
  db_data:
