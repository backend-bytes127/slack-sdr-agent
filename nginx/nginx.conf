map $http_upgrade $connection_upgrade {
  default upgrade;
  ''      close;
}

upstream n8n {
  server n8n:5678;
  keepalive 16;
}

server {
  listen 80;
  server_name _;

  client_max_body_size 16m;
  proxy_read_timeout 300s;
  proxy_send_timeout 300s;

  # Common proxy headers
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_set_header Upgrade $http_upgrade;
  proxy_set_header Connection $connection_upgrade;

  # Public: webhooks from Slack + Clay (raw body untouched for Slack signature checks)
  location ~ ^/(webhook|webhook-test|webhook-waiting|form|form-test)/ {
    proxy_buffering off;
    proxy_request_buffering off;
    proxy_pass http://n8n;
  }

  location = /healthz {
    proxy_pass http://n8n;
  }

  # Editor/UI: only from localhost, never via the public tunnel (ngrok sets ngrok-* headers)
  location / {
    if ($http_x_forwarded_host) { return 403; }
    proxy_pass http://n8n;
  }
}
